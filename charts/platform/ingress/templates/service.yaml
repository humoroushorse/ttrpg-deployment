{{- if .Values.controller.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: ingress-nginx-controller
  namespace: {{ include "ingress.namespace" . }}
  labels:
    {{- include "ingress.labels" . | nindent 4 }}
  {{- with .Values.controller.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.controller.service.type }}
  {{- if and (eq .Values.controller.service.type "LoadBalancer") .Values.controller.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.controller.service.loadBalancerIP }}
  {{- end }}
  ports:
    - name: http
      port: {{ .Values.controller.service.ports.http }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.controller.service.type "NodePort") .Values.controller.service.nodePorts.http }}
      nodePort: {{ .Values.controller.service.nodePorts.http }}
      {{- end }}
    - name: https
      port: {{ .Values.controller.service.ports.https }}
      targetPort: https
      protocol: TCP
      {{- if and (eq .Values.controller.service.type "NodePort") .Values.controller.service.nodePorts.https }}
      nodePort: {{ .Values.controller.service.nodePorts.https }}
      {{- end }}
  selector:
    {{- include "ingress.selectorLabels" . | nindent 4 }}
{{- end }}
