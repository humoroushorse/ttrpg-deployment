{{- if .Values.controller.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "ingress.namespace" . }}
  labels:
    {{- include "ingress.labels" . | nindent 4 }}
    name: {{ include "ingress.namespace" . }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-15"
{{- end }}
