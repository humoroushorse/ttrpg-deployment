# Local environment values for Platform infrastructure

environment: "local"
domain: "localhost"

# PostgreSQL
postgresql:
  enabled: true
  mode: "statefulset"
  storage: "5Gi"
  replicas: 1
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# Keycloak
keycloak:
  enabled: true
  replicas: 1
  hostname: "localhost"
  resources:
    requests:
      cpu: "50m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  realms:
    - name: dnd
      clients:
        - clientId: dnd-client
          publicClient: true
          redirectUris:
            - "http://localhost:8080/ttrpg/dnd/*"
            - "http://localhost:4200/*"
    - name: sprint-management
      clients:
        - clientId: sprint-client
          publicClient: true
          redirectUris:
            - "http://localhost:8080/ttrpg/sprint-management/*"
            - "http://localhost:4204/*"
  livenessProbe: null
  readinessProbe: null

# NATS
nats:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: "25m"
      memory: "32Mi"
    limits:
      cpu: "250m"
      memory: "128Mi"

# Ingress
ingress:
  enabled: true
  className: "nginx"
  controller:
    service:
      type: LoadBalancer
  tls:
    enabled: false
  keycloak:
    enabled: false
