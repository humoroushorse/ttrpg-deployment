{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "keycloak.fullname" . }}
  namespace: {{ include "keycloak.namespace" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "keycloak.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "vault.keycloakAnnotations" . | nindent 8 }}
      labels:
        {{- include "keycloak.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "keycloak.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
      - name: keycloak
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          {{- toYaml .Values.containerSecurityContext | nindent 10 }}
        command:
          - /bin/sh
          - -c
          - |
            # For local development, use simple credentials
            # In production, these would come from Vault
            export DB_USERNAME="${POSTGRES_USER:-postgres}"
            export DB_PASSWORD="${POSTGRES_PASSWORD:-TEMPORARY_PASSWORD_WILL_BE_ROTATED}"
            
            # Start Keycloak
            /opt/keycloak/bin/kc.sh start \
              --db=postgres \
              --db-url-host={{ include "keycloak.databaseHost" . }} \
              --db-url-database={{ .Values.database.name }} \
              --db-username=${DB_USERNAME} \
              --db-password=${DB_PASSWORD} \
              --hostname={{ .Values.keycloak.hostname }} \
              --http-enabled={{ .Values.keycloak.httpEnabled }} \
              --http-port={{ .Values.keycloak.httpPort }} \
              --proxy={{ .Values.keycloak.proxy }}
        env:
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "TEMPORARY_PASSWORD_WILL_BE_ROTATED"
        - name: KEYCLOAK_ADMIN
          value: "admin"
        - name: KEYCLOAK_ADMIN_PASSWORD
          value: "admin"
        ports:
        - name: http
          containerPort: {{ .Values.service.targetPort }}
          protocol: TCP
        {{- if .Values.livenessProbe }}
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 10 }}
        {{- end }}
        {{- if .Values.readinessProbe }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 10 }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: data
          mountPath: /opt/keycloak/data
      volumes:
      - name: tmp
        emptyDir: {}
      - name: data
        emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
