{{- if .Values.monitoring.enabled }}
{{- if .Values.monitoring.prometheus.enabled }}
---
# ServiceMonitor for go-auth
{{- if index .Values "go-auth" "enabled" }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: go-auth
  namespace: ttrpg-{{ .Values.environment }}
  labels:
    app: go-auth
    environment: {{ .Values.environment }}
    prometheus: {{ .Values.monitoring.prometheus.instance | default "kube-prometheus" }}
spec:
  selector:
    matchLabels:
      app: go-auth
  endpoints:
  - port: http
    path: /metrics
    interval: {{ .Values.monitoring.prometheus.scrapeInterval | default "30s" }}
    scrapeTimeout: {{ .Values.monitoring.prometheus.scrapeTimeout | default "10s" }}
{{- end }}
