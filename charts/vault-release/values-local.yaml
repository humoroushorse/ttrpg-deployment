# Local environment values for Vault
# Uses official HashiCorp Vault Helm chart

vault:
  global:
    enabled: true
  
  server:
    # Dev mode for local - NOT for production
    dev:
      enabled: true
      devRootToken: "root"
    
    # Single replica for local
    ha:
      enabled: false
    
    # Standalone mode with file storage
    standalone:
      enabled: true
      config: |
        ui = true
        
        listener "tcp" {
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_disable = 1
        }
        
        storage "file" {
          path = "/vault/data"
        }
    
    # Service configuration
    service:
      enabled: true
      type: ClusterIP
      port: 8200
    
    # Resources
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    
    # Data storage
    dataStorage:
      enabled: true
      size: 5Gi
      storageClass: null
      accessMode: ReadWriteOnce
    
    # Security context
    securityContext:
      runAsNonRoot: true
      runAsUser: 100
      fsGroup: 1000
  
  # Vault Agent Injector
  injector:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: "25m"
        memory: "64Mi"
      limits:
        cpu: "250m"
        memory: "256Mi"
  
  # UI
  ui:
    enabled: true
    serviceType: "ClusterIP"
