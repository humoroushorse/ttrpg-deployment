apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ui-dnd.fullname" . }}
  namespace: {{ include "ui-dnd.namespace" . }}
  labels:
    {{- include "ui-dnd.labels" . | nindent 4 }}
data:
  # Nginx configuration
  default.conf: |
    resolver kube-dns.kube-system.svc.cluster.local valid=10s;

    server {
        listen 4200;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # API proxy under subpath (ingress sends /ttrpg/dnd/api/v1/... here)
        location /ttrpg/dnd/api/v1/ {
            set $backend "http://{{ .Release.Name }}-py-dnd.{{ include "ui-dnd.namespace" . }}.svc.cluster.local:8001";
            proxy_pass $backend/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Serve under /ttrpg/dnd/ subpath (matches base-href)
        location /ttrpg/dnd/ {
            alias /usr/share/nginx/html/;
            try_files $uri $uri/ /index.html;
        }

        # API proxy for direct port-forward access
        location /api/v1/ {
            set $backend "http://{{ .Release.Name }}-py-dnd.{{ include "ui-dnd.namespace" . }}.svc.cluster.local:8001";
            proxy_pass $backend/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Fallback for root access (direct port-forward)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

  # Application runtime configuration
  app.config.json: |
    {
      "apiBasePath": "/api/v1",
      "spellApiBasePath": "/api/v1"
    }
