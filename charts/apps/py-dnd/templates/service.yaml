apiVersion: v1
kind: Service
metadata:
  name: {{ include "py-dnd.fullname" . }}
  namespace: {{ include "py-dnd.namespace" . }}
  labels:
    {{- include "py-dnd.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort | default .Values.service.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "py-dnd.selectorLabels" . | nindent 4 }}
