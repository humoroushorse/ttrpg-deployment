# Local environment values for Applications

global:
  version: "latest"
  environment: "local"
  postgresql:
    host: "platform-postgresql.platform.svc.cluster.local"
    port: 5432
  nats:
    url: "nats://platform-nats-client.platform.svc.cluster.local:4222"

# go-auth
go-auth:
  enabled: true
  replicaCount: 1
  vault:
    enabled: true
  image:
    repository: "localhost:5000/go-auth"
    pullPolicy: "Never"
  serviceAccount:
    create: true
    name: "go-auth"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
  migration:
    enabled: true
    image:
      repository: "localhost:5000/go-auth"
      pullPolicy: "Never"
  livenessProbe: null
  readinessProbe: null

