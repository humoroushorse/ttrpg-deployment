# Default values for go-sprint
# This is a YAML-formatted file.

# Global values (inherited from parent chart)
global:
  version: "latest"

# Environment: local, dev, or prod
environment: "local"

# Application version (overrides global.version if set)
version: ""

# Number of replicas
replicaCount: 1

# Image configuration
image:
  repository: "ghcr.io/your-org/go-sprint"
  pullPolicy: "IfNotPresent"
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Service account configuration
serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Service configuration
service:
  type: ClusterIP
  port: 8003
  targetPort: 8003

# Database configuration
database:
  name: "sprint_management"

# Application binary name
appBinary: "sprint-server"

# Health check configuration
# Health check configuration - temporarily disabled
livenessProbe: null
readinessProbe: null

# Resource limits and requests
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

nodeSelector: {}
tolerations: []
affinity: {}
env: []
volumes: []
volumeMounts: []

# Pod Disruption Budget
podDisruptionBudget:
  enabled: false
  minAvailable: "50%"

# Horizontal Pod Autoscaler
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Database Migration Configuration
migration:
  # Enable database migrations before deployment
  enabled: true
  
  # Migration job image (defaults to main application image)
  image:
    repository: "ghcr.io/your-org/go-sprint"
    tag: ""  # Defaults to application image tag
    pullPolicy: "IfNotPresent"
  
  # Database connection settings
  database:
    host: ""  # Defaults to postgresql.ttrpg-{env}.svc.cluster.local
    port: "5432"
    name: ""  # Defaults to .Values.database.name
    user: "postgres"
    password: ""  # Defaults to TEMPORARY_PASSWORD_WILL_BE_ROTATED in template
  
  # Job configuration
  backoffLimit: 3  # Retry up to 3 times on failure
  ttlSecondsAfterFinished: 86400  # Delete completed jobs after 24 hours
  
  # Additional environment variables for migration job
  env: []
  
  # Resource limits for migration job
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  
  # Additional volumes for migration job
  volumes: []
  volumeMounts: []
